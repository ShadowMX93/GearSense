name: Release GearSense

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: gearsense-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Choose release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(gradle -q printVersion)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Project version must use X.Y.Z format, found: $current" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$current" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match pom.xml version $current" >&2
              exit 1
            fi
            create_tag=false
          elif git rev-parse --verify --quiet "refs/tags/v$current" >/dev/null; then
            IFS=. read -r major minor patch <<< "$current"
            version="$major.$minor.$((patch + 1))"
            create_tag=true
          else
            version="$current"
            create_tag=true
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"

      - name: Update version files
        if: steps.version.outputs.version != steps.version.outputs.current
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "0,/<version>[0-9]+\.[0-9]+\.[0-9]+<\\/version>/s//<version>$NEW_VERSION<\\/version>/" pom.xml
          sed -i -E "s/^version = '[0-9]+\.[0-9]+\.[0-9]+'/version = '$NEW_VERSION'/" build.gradle
          sed -i -E "s/^Implementation-Version: .*/Implementation-Version: $NEW_VERSION/" src/main/resources/META-INF/MANIFEST.MF
          sed -i -E "s/GearSense-[0-9]+\.[0-9]+\.[0-9]+\.jar/GearSense-$NEW_VERSION.jar/g" README.md

      - name: Verify build
        run: gradle --no-daemon clean build

      - name: Commit version bump
        if: steps.version.outputs.version != steps.version.outputs.current
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git add pom.xml build.gradle README.md src/main/resources/META-INF/MANIFEST.MF
          git commit -m "chore: release $NEW_VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "GearSense $VERSION"
          git push origin "$TAG"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/libs/GearSense-$VERSION.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
          else
            gh release create "$TAG" "$jar" --title "GearSense $VERSION" --generate-notes
          fi
